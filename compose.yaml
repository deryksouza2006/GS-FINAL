services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citizentech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citizentech}
      POSTGRES_USER: ${POSTGRES_USER:-citizentech}
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - citizentech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-citizentech} -d ${POSTGRES_DB:-citizentech}']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: 'rabbitmq:4.1-management'
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no .env}
    volumes:
      - citizentech_rabbitdata:/var/lib/rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  citizentech_pgdata:
  citizentech_rabbitdata:
