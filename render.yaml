services:
  - type: web
    name: agroconecta-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: agroconecta-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agroconecta-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: agroconecta-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: agroconecta-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agroconecta-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: agroconecta-api
      - key: APP_DEMO_ENABLED
        value: "true"
      - key: APP_AI_ENABLED
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      - key: READINGS_MESSAGING_ENABLED
        value: "true"
      - key: OUTBOX_ENABLED
        value: "true"
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "true"

databases:
  - name: agroconecta-db
    databaseName: agroconecta
    user: agroconecta
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
