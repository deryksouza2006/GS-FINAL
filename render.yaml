services:
  - type: web
    name: agroconecta-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: agroconecta-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: agroconecta-api
      - key: APP_DEMO_ENABLED
        value: "true"
      - key: APP_AI_ENABLED
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      # O primeiro deploy não depende de um broker pago. Ative após ligar o RabbitMQ.
      - key: READINGS_MESSAGING_ENABLED
        value: "false"
      - key: OUTBOX_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "false"

databases:
  - name: agroconecta-db
    databaseName: agroconecta
    user: agroconecta
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
